<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能学习桌</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#223249;font:16px system-ui,sans-serif}main{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:30px;margin:0}header p{color:#617184;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}section{background:white;padding:25px;border-radius:18px;box-shadow:0 4px 20px #20304008}h2{font-size:20px;margin:0 0 18px}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #ccd5df}input,select{max-width:100%;width:100%;margin:8px 0 12px}button{background:#2859d6;color:white;border:0;margin:5px 5px 5px 0;cursor:pointer}button.secondary{background:#eaf0fb;color:#2859d6}button:disabled{opacity:.5;cursor:wait}label{font-size:14px;color:#526276}.result{white-space:pre-wrap;line-height:1.7;margin-top:15px;color:#36516d}.note{font-size:13px;color:#7a6870;line-height:1.6}.lamp{height:32px;border-radius:8px;background:#e8edf4;margin:12px 0}.error{color:#b62b40}#connection{font-size:14px;color:#526276;margin:15px 0 24px}
</style>
<main><header><h1>智能学习桌</h1><p>先在电脑上验证学习流程。灯光为模拟预览；找书使用启动时指定的照片，尚未连接摄像头和定位灯。</p></header><div id="connection">正在连接本地服务…</div><div class="grid">
<section><h2>专注计时</h2><label for="minutes">专注时长（分钟）</label><input id="minutes" type="number" min="1" max="120" value="25"><button onclick="timer('start')">开始</button><button class="secondary" onclick="timer('pause')">暂停</button><button class="secondary" onclick="timer('resume')">继续</button><button class="secondary" onclick="timer('stop')">结束</button><div id="timerResult" class="result">尚未开始</div></section>
<section><h2>灯光预览</h2><label for="scene">场景</label><select id="scene"><option value="focus">专注</option><option value="rest">休息</option><option value="off">关闭</option></select><label for="brightness">亮度（0—100）</label><input id="brightness" type="number" min="0" max="100" value="50"><button onclick="light()">预览</button><div id="lamp" class="lamp"></div><div id="lightResult" class="result">尚未预览</div><p class="note">仅保存和显示目标场景，实际灯具未接入。</p></section>
<section><h2>照片找书</h2><label for="title">书名</label><input id="title" placeholder="输入照片中的书名"><button id="findButton" onclick="findBook()">查找</button><div id="bookResult" class="result">请使用服务启动时配置的书架照片。</div><p class="note">结果用于离线算法验证，不能代表真实书架已亮灯。</p></section>
<section><h2>考试倒计时</h2><label for="examName">考试名称</label><input id="examName" maxlength="80" placeholder="例如：期末考试"><label for="examDate">考试日期</label><input id="examDate" type="date"><button onclick="saveExam()">保存</button><button class="secondary" onclick="clearExam()">清除</button><div id="examResult" class="result">尚未设置</div></section>
<section><h2>文件与错题记录</h2><label for="recordKind">记录类型</label><select id="recordKind" onchange="recordOffset=0;listRecords()"><option value="paper.record.">文件</option><option value="wrong_question.">错题</option></select><label for="recordTitle">标题</label><input id="recordTitle" maxlength="100"><label for="recordSubject">科目</label><input id="recordSubject" maxlength="80"><label for="recordNotes">备注</label><input id="recordNotes" maxlength="200"><label for="recordLocation">人工放置位置</label><input id="recordLocation" maxlength="120"><button onclick="addRecord()">添加记录</button><button class="secondary" onclick="listRecords()">刷新</button><div id="recordResult" class="result"></div><div id="recordList" class="result"></div><button class="secondary" onclick="recordOffset=Math.max(0,recordOffset-3);listRecords()">上一页</button><button class="secondary" onclick="recordOffset+=3;listRecords()">下一页</button><p class="note">仅保存文字记录，请人工放置纸张。关闭服务后能否保留记录，取决于启动时是否指定数据库文件。</p></section>
</div></main>
<script>
const el=id=>document.getElementById(id);
const errors={camera_and_locator_not_connected:'尚未配置找书照片。',book_image_not_configured:'尚未配置找书照片。',title_required:'请输入书名。',minutes_must_be_1_to_120:'时长应为 1—120 分钟。',invalid_brightness:'亮度应为 0—100。',timer_not_running:'当前没有正在运行的计时。',timer_not_paused:'当前没有暂停的计时。',invalid_name:'请输入考试名称。',invalid_date:'请选择考试日期。',invalid_exam_date:'考试日期格式不正确。',invalid_title:'请输入记录标题。',book_scan_busy:'照片识别忙碌，请稍后再试。',book_scan_failed:'照片识别失败，请检查照片与算法环境。',storage_unavailable:'记录暂时无法保存，请检查数据库文件。'};
async function request(action,params={}){const res=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({v:1,type:'request',id:crypto.randomUUID(),action,params})});const r=await res.json();if(!res.ok||r.status==='failed'||r.type==='error')throw Error(errors[r.error]||'操作未完成，请检查服务输出。');if(!['success','pending'].includes(r.status))throw Error('服务返回了无法确认的状态，请检查服务输出。');return r;}
function show(id,text,bad=false){el(id).textContent=text;el(id).classList.toggle('error',bad)}
function timerText(d){if(d.remaining_seconds!==undefined){const s=Math.ceil(d.remaining_seconds);return `${d.state==='paused'?'已暂停':d.state==='idle'?'尚未开始或已结束':'专注中'} · 剩余 ${Math.floor(s/60)} 分 ${s%60} 秒`;}return d.timer_active===false?'计时已结束':d.minutes?`已开始 ${d.minutes} 分钟计时`:'计时状态已更新';}
async function timer(op){try{const r=await request('timer.'+op,op==='start'?{minutes:Number(el('minutes').value)}:{});show('timerResult',timerText(r.data||{}));}catch(e){show('timerResult',e.message,true)}}
async function light(){try{const scene=el('scene').value,brightness=Number(el('brightness').value);await request('light.scene',{scene,brightness});el('lamp').style.background=scene==='off'?'#e8edf4':`rgba(${scene==='focus'?'255,212,122':'255,170,120'},${brightness/100})`;show('lightResult',`模拟预览：${el('scene').selectedOptions[0].text}，亮度 ${brightness}%`);}catch(e){show('lightResult',e.message,true)}}
function bookText(d){if(d.result)d=d.result;if(d.data)d=d.data;if(d.matches){if(!d.matches.length)return '照片中未找到匹配书籍。';return d.matches.map((m,i)=>`${i+1}. ${m.text||m.title||'匹配书籍'}${m.normalized_center?' · 照片位置 '+m.normalized_center.map(x=>Math.round(x*100)+'%').join('，'):''}`).join('\n');}if(d.found===false)return '照片中未找到匹配书籍。';return d.message||'识别已完成，可在输出记录中查看结果。';}
let finding=false;
async function findBook(){finding=true;el('findButton').disabled=true;try{let r=await request('book.find',{title:el('title').value.trim()});let attempts=0;let rid=r.id;while(r.status==='pending'||(r.data&&r.data.status==='pending')){show('bookResult','正在识别照片…');if(++attempts>180)throw Error('识别尚未完成，请稍后重试。');rid=r.data?.request_id||rid;await new Promise(resolve=>setTimeout(resolve,500));r=await request('job.get',{request_id:rid});if(r.data?.status==='failed')throw Error(errors[r.data.error]||'识别失败，请检查服务输出。');if(r.data?.status==='success')break;if(r.data?.status!=='pending')throw Error('无法确认识别状态，请检查服务输出。');}show('bookResult',bookText(r.data||{}));}catch(e){show('bookResult',e.message,true)}finally{finding=false;el('findButton').disabled=false}}
function examText(d){return !d.configured?'尚未设置':`${d.name} · ${d.date}\n${d.days_remaining>0?'还有 '+d.days_remaining+' 天':d.days_remaining===0?'今天考试':'考试日期已过去 '+(-d.days_remaining)+' 天'}`;}
async function saveExam(){try{const r=await request('exam.set',{name:el('examName').value.trim(),date:el('examDate').value});show('examResult',examText(r.data));}catch(e){show('examResult',e.message,true)}}
async function clearExam(){try{await request('exam.clear');show('examResult','尚未设置');}catch(e){show('examResult',e.message,true)}}
let recordOffset=0;
async function addRecord(){try{const r=await request(el('recordKind').value+'create',{title:el('recordTitle').value.trim(),subject:el('recordSubject').value.trim(),notes:el('recordNotes').value.trim(),location:el('recordLocation').value.trim()});show('recordResult','记录已保存，请人工放置纸张。');recordOffset=0;await listRecords();}catch(e){show('recordResult',e.message,true)}}
async function listRecords(){try{const r=await request(el('recordKind').value+'list',{limit:3,offset:recordOffset});show('recordList',r.data.records.length?r.data.records.map(x=>`${x.id}. ${x.title}${x.resolved?'（已掌握）':''}`).join('\n'):'本页没有记录。');}catch(e){show('recordList',e.message,true)}}
let refreshing=false;
async function refresh(){if(refreshing)return;refreshing=true;try{const r=await request('status');show('connection','本地服务已连接 · 硬件尚未接入');show('timerResult',timerText(r.data.timer||{}));el('findButton').disabled=finding||r.data.book_source!=='offline_image';if(r.data.book_source!=='offline_image')show('bookResult','尚未配置找书照片。请启动服务时指定本地书架照片。');const exam=await request('exam.get');show('examResult',examText(exam.data));const events=await(await fetch('/api/events')).json();if(events.events?.some(x=>x.name==='timer.finished'))show('timerResult','本次专注已结束，休息一下吧。');}catch(e){show('connection','本地服务未连接或暂时不可用',true)}finally{refreshing=false}}refresh();listRecords();setInterval(refresh,1000);
</script></html>
